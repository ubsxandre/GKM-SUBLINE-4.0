{% extends "layouts/base.html" %}

{% block title %} Report Produktifitas Operator {% endblock %}

{% block stylesheets %}{% endblock stylesheets %}

{% block content %}

<div class="container-xxl flex-grow-1 container-p-y">
  <div class="card mb-6">
    <div class="card-body">
      <div class="row mb-5 g-5">
        <div class="col-12 col-md-6">
          <div class="form-floating form-floating-outline">
            <div class="form-floating form-floating-outline">
              <input class="form-control form-control-sm" type="date" id="start_date" onclick="document.getElementById('start_date').showPicker()">
              <label for="start_date">Start Date</label>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="form-floating form-floating-outline">
            <div class="form-floating form-floating-outline">
              <input class="form-control form-control-sm" type="date" id="end_date" onclick="document.getElementById('end_date').showPicker()">
              <label for="end_date">End Date</label>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="form-floating form-floating-outline">
            <div class="form-floating form-floating-outline">
              <select class="form-select form-select-sm select2" id="lokasi_proses" multiple> </select>
              <label for="lokasi_proses">Lokasi Proses</label>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="form-floating form-floating-outline">
            <div class="form-floating form-floating-outline">
              <select class="form-select form-select-sm select2" id="nik" multiple> </select>
              <label for="nik">NIK</label>
            </div>
          </div>
        </div>

        <div class="text-end">
          <button type="button" class="btn btn-secondary waves-effect waves-light add-record">
              <i class="ri-refresh-line ri-16px me-sm-2"></i> Reset
          </button>
          <button type="button" class="btn btn-success waves-effect waves-light" id="button-export">
              <i class="ri-download-line ri-16px me-sm-2"></i> Excel
          </button>
          <button type="button" class="btn btn-primary waves-effect waves-light" id="button-cari">
              <i class="ri-search-line ri-16px me-sm-2"></i> Cari
            </button>
        </div>
      </div>      
    </div>
  </div>

  <div class="card">
    <div class="card-datatable table-responsive pt-0">
      <div id="DataTables_Table_0_wrapper" class="dataTables_wrapper dt-bootstrap5 no-footer">
        <div class="card-datatable-suma table-responsive">
          <table class="table w-100 datatable-suma" id="datatable-suma">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Nik</th>
                <th>Nama</th>
                <th>Kuantitas Izin</th>
                <th>Total Izin (Jam)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  


</div>

<!-- DETAIL MODAL -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Detail</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modal-body">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>


<script>
  let table_suma;
  $(document).ready(function () {
    table_suma = $('#datatable-suma').DataTable({
      processing: true,
      serverSide: false,
      searching: true,
      paging: true,
      ordering: [[0, 'asc']],
      info: true,
      language: {
        emptyTable: "Tidak ada data tersedia",
        processing: "Memuat...",
      },
      columns: [
        { data: 'lokasi_proses' },
        { data: 'tgl_input' },
        { data: 'nik' },
        { data: 'nama_operator' },
        { data: 'no_voucher_pecah' },
        { data: 'point' },
      ]
    }); table_suma.on('draw', function() {initializeTooltips();});
  });
</script>



{% endblock content %}

{% block javascripts %}{% endblock javascripts %}
